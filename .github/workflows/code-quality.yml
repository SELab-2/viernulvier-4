name: Code Quality

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  check-quality:
    name: Lint & Format
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Formatting (Prettier)
        run: run: npx prettier --check "backend/**/*.{vue,ts,js,json,css,scss}" "frontend/**/*.{vue,ts,js,json,css,scss}" "common/**/*.{vue,ts,js,json,css,scss}"

      - name: Check Linting (ESLint)
        run: npx eslint backend/ frontend/ common/
