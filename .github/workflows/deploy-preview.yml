name: Deploy Preview

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Deploy preview
        run: |
          PR=${{ github.event.pull_request.number }}
          export NUXT_BASE="/previews/$PR/"
          PR_PATH="/home/selab2/project/previews/$PR"
          FRONTEND_PORT="30$PR"
          BACKEND_PORT="40$PR"

          mkdir -p $PR_PATH
          rsync -av --delete --exclude 'node_modules' --exclude '.git' . $PR_PATH/

          # --- 1. Docs Setup ---
          cd $PR_PATH
          python3 -m pip install mkdocs-material
          python3 -m mkdocs build
          mkdir -p frontend/public
          rm -rf frontend/public/docs
          mv site frontend/public/docs

          # --- 2. Backend Setup & Deployment ---
          cd $PR_PATH/backend
          
          npm ci
          npm run build 
          
          pm2 delete preview-backend-$PR || true
          PORT=$BACKEND_PORT pm2 start dist/main.js --name preview-backend-$PR
          pm2 save

          # --- 3. Frontend Setup & Deployment ---
          cd $PR_PATH/frontend
          npm ci
          npx nuxi cleanup

          # Connect frontend to the NGINX-routed backend preview
          NUXT_API_BASE="https://sel2-4.ugent.be/previews/$PR/api" \
          MEDIA_BASE_URL="https://sel2-4.ugent.be/previews/$PR" \
          npm run build

          pm2 delete preview-$PR || true
          PORT=$FRONTEND_PORT pm2 start .output/server/index.mjs --name preview-$PR
          
          pm2 save

      - name: Post preview link
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            🚀 **Preview Build successfully deployed!**

            📱 **Website Preview:** https://sel2-4.ugent.be/previews/${{ github.event.pull_request.number }}/
            📚 **Docs Preview:** https://sel2-4.ugent.be/previews/${{ github.event.pull_request.number }}/docs/
            ⚙️ **Backend API Base:** https://sel2-4.ugent.be/previews/${{ github.event.pull_request.number }}/api
          comment_tag: preview_link