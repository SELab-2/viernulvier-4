name: Pull Request Preview Cleanup
# stops the pr preview when we close the pr.
on:
  pull_request:
    types: [ closed ]  # Trigger only when PR is closed

jobs:
  cleanup:
    runs-on: self-hosted

    steps:
      - name: Stop PR preview
        run: |
          PR=${{ github.event.pull_request.number }}
          FRONTEND_PREVIEW="preview-$PR"
          BACKEND_PREVIEW="preview-backend-$PR"
          PREVIEW_PATH="/home/selab2/project/previews/$PR"

          echo "Stopping Frontend PM2 preview: $FRONTEND_PREVIEW"
          pm2 delete $FRONTEND_PREVIEW || echo "Frontend process not found or already deleted"

          echo "Stopping Backend PM2 preview: $BACKEND_PREVIEW"
          pm2 delete $BACKEND_PREVIEW || echo "Backend process not found or already deleted"

          # Save PM2 state so deleted processes don't return on server reboot
          pm2 save

          echo "Removing preview folder: $PREVIEW_PATH"
          rm -rf $PREVIEW_PATH || echo "No folder found"